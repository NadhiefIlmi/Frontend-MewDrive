name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e

            echo ">>> Masuk ke direktori frontend"
            cd /var/mydrive/Frontend-MewDrive

            echo ">>> Pull latest code dari main"
            git pull origin main

            echo ">>> Install dependencies"
            npm ci

            echo ">>> Build frontend"
            npm run build

            echo ">>> Verifikasi build output ada"
            ls -la .output/

            echo ">>> Reload frontend tanpa downtime"
            pm2 reload mewdrive-frontend --update-env

            echo ">>> Simpan state PM2"
            pm2 save

            echo ">>> Deploy frontend selesai!"
